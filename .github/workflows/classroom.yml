name: GitHub Classroom Workflow
on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest services/ -v

  integration-tests:
    name: Integration Tests & Autograding
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Clean Docker cache and volumes
        run: |
          docker system prune -f
          docker builder prune -f
          docker volume prune -f

      - name: Build images
        timeout-minutes: 15
        run: docker compose build --no-cache

      - name: Run containers
        timeout-minutes: 10
        run: |
          docker compose down -v
          docker compose up -d
          chmod +x ./scripts/wait-script.sh
          chmod +x ./scripts/wait-for.sh
          ./scripts/wait-script.sh
          sleep 10
        env:
          WAIT_PORTS: 8080,8070,8060,8050

      - name: Run API Tests
        timeout-minutes: 10
        run: |
          chmod +x ./scripts/test-script.sh
          ./scripts/test-script.sh v3 payment-service 8050

      - uses: education/autograding@v1
        id: autograder
        continue-on-error: true

      - name: Stop containers
        if: always()
        continue-on-error: true
        run: docker compose down -v

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test'
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Link Railway project
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "Error: RAILWAY_TOKEN is not set"
            exit 1
          fi
          npx -y @railway/cli link --project 5203a8c8-c3fd-4730-8d5c-a0286758b719
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      
      - name: Set environment variables
        run: npx -y @railway/cli variables --set "SERVICE_NAME=gateway" --set "PORT=8080"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      
      - name: Deploy to Railway
        run: npx -y @railway/cli up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Wait for deployment
        run: |
          echo "Waiting for Railway deployment to complete..."
          sleep 30

      - name: Test deployed application
        run: |
          # Use the known Railway URL
          RAILWAY_URL="https://lab3-template-production.up.railway.app"
          echo "Railway URL: $RAILWAY_URL"
          
          # Test health endpoint
          echo "Testing health endpoint..."
          curl -f "$RAILWAY_URL/manage/health" || exit 1
          
          # Test cars endpoint
          echo "Testing cars endpoint..."
          curl -f "$RAILWAY_URL/api/v1/cars?page=1&size=10&showAll=false" || exit 1
          
          echo "Deployment successful! Application is running at: $RAILWAY_URL"