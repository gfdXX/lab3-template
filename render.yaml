services:
  # PostgreSQL Database
  - type: pserv
    name: car-rental-db
    env: docker
    dockerfilePath: ./Dockerfile.db
    plan: starter
    envVars:
      - key: POSTGRES_USER
        value: program
      - key: POSTGRES_PASSWORD
        value: test
      - key: POSTGRES_DB
        value: postgres

  # Gateway Service
  - type: web
    name: car-rental-gateway
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: SERVICE_NAME
        value: gateway
      - key: CARS_SERVICE_URL
        value: https://car-rental-cars.onrender.com
      - key: RENTAL_SERVICE_URL
        value: https://car-rental-rental.onrender.com
      - key: PAYMENT_SERVICE_URL
        value: https://car-rental-payment.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: car-rental-db
          property: connectionString

  # Cars Service
  - type: web
    name: car-rental-cars
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: SERVICE_NAME
        value: cars
      - key: DATABASE_URL
        fromDatabase:
          name: car-rental-db
          property: connectionString

  # Rental Service
  - type: web
    name: car-rental-rental
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: SERVICE_NAME
        value: rental
      - key: DATABASE_URL
        fromDatabase:
          name: car-rental-db
          property: connectionString

  # Payment Service
  - type: web
    name: car-rental-payment
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: SERVICE_NAME
        value: payment
      - key: DATABASE_URL
        fromDatabase:
          name: car-rental-db
          property: connectionString
